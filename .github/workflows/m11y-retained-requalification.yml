name: M11Y Retained Announcement Requalification

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact build/pvb24-v1 SHA that passed PVB-24 CI
        required: true
        type: string

permissions:
  actions: read
  contents: read

jobs:
  requalify:
    if: >-
      github.repository == 'novacorestudios/Pvp-24' &&
      github.ref == 'refs/heads/build/pvb24-v1'
    runs-on: ubuntu-latest
    env:
      DURABLE_LOCATOR: "docs/data/11t-durable-evidence.json"
      SOURCE_QUALIFICATION_SHA256: >-
        ed5539a48c6fca0fca16823bfd4dfd60ad3048c57716635adbb5d04d4b5ddd3a
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e '.[dev]'
      - name: Qualify exact producer SHA against CI
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONPATH: src
        run: |
          python scripts/verify_evidence_ci.py \
            --repository "$GITHUB_REPOSITORY" \
            --sha "${{ inputs.source_sha }}" \
            --wait-seconds 90 \
            --output artifacts/evidence-ci/ci.json
      - name: Verify repository provenance
        run: python scripts/verify_provenance.py
      - name: Restore exact durable announcement sources
        run: |
          python scripts/durable_m11t_evidence.py verify \
            --locator "$DURABLE_LOCATOR"
          python scripts/durable_m11t_evidence.py restore \
            --locator "$DURABLE_LOCATOR" \
            --destination artifacts/m11y/source \
            --artifact announcement-inventory-evidence \
            --artifact announcement-body-qualification-evidence
      - name: Requalify exact retained source bytes
        run: |
          mkdir -p artifacts/m11y/output
          python scripts/requalify_retained_announcement_evidence.py \
            --locator "$DURABLE_LOCATOR" \
            --inventory-root \
              artifacts/m11y/source/announcement-inventory-evidence \
            --qualification-root \
              artifacts/m11y/source/announcement-body-qualification-evidence \
            --source-report-sha256 "$SOURCE_QUALIFICATION_SHA256" \
            --output \
              artifacts/m11y/output/11y-retained-announcement-requalification.json
          sha256sum \
            artifacts/m11y/output/11y-retained-announcement-requalification.json
      - name: Seal evidence artifact qualification
        env:
          PYTHONPATH: src
        run: |
          python scripts/qualify_evidence_artifact.py create \
            --root artifacts/m11y/output \
            --ci-attestation artifacts/evidence-ci/ci.json
          python scripts/qualify_evidence_artifact.py verify \
            --root artifacts/m11y/output \
            --ci-attestation artifacts/evidence-ci/ci.json \
            --expected-sha "${{ inputs.source_sha }}"
      - uses: actions/upload-artifact@v4
        with:
          name: m11y-retained-announcement-requalification
          path: artifacts/m11y/output
          if-no-files-found: error
