name: M11X Retained Lifecycle Recovery

on:
  push:
    branches:
      - build/pvb24-v1
    paths:
      - ".github/workflows/m11x-retained-listing-recovery.yml"
      - "src/pvb24/data/announcements.py"
      - "src/pvb24/data/announcement_qualification.py"
      - "src/pvb24/data/announcement_recovery.py"
      - "scripts/recover_retained_listing_facts.py"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  recover:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_RUN_ID: "35636682664"
      SOURCE_REPORT_SHA256: "ed5539a48c6fca0fca16823bfd4dfd60ad3048c57716635adbb5d04d4b5ddd3a"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e '.[dev]'
      - name: Restore pinned retained qualification evidence
        run: |
          mkdir -p artifacts/m11x/qualification
          gh run download "$SOURCE_RUN_ID" \
            --repo "${{ github.repository }}" \
            --name announcement-body-qualification-evidence \
            --dir artifacts/m11x/qualification
      - name: Verify repository provenance
        run: python scripts/verify_provenance.py
      - name: Replay retained sources with bounded lifecycle recovery
        run: |
          mkdir -p artifacts/m11x/recovery
          python scripts/recover_retained_listing_facts.py \
            --root artifacts/m11x/qualification \
            --report-sha256 "$SOURCE_REPORT_SHA256" \
            --output artifacts/m11x/recovery/11x-retained-listing-recovery.json
          sha256sum artifacts/m11x/recovery/11x-retained-listing-recovery.json
      - uses: actions/upload-artifact@v4
        with:
          name: m11x-retained-listing-recovery
          path: artifacts/m11x/recovery/11x-retained-listing-recovery.json
          if-no-files-found: error
