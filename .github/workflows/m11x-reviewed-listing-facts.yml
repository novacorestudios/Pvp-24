name: M11X Reviewed Listing Facts and Activity

on:
  push:
    branches:
      - build/pvb24-v1
    paths:
      - ".github/workflows/m11x-reviewed-listing-facts.yml"
      - "src/pvb24/data/reviewed_listing_facts.py"
      - "src/pvb24/data/reviewed_listing_activity.py"
      - "scripts/compile_reviewed_listing_facts.py"
      - "scripts/audit_reviewed_listing_activity.py"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  compile:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_RUN_ID: "35666586892"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e '.[dev]'
      - name: Restore reviewed listing source batch
        run: |
          set -euo pipefail
          mkdir -p artifacts/m11x/source
          gh run download "$SOURCE_RUN_ID" \
            --repo "${{ github.repository }}" \
            --name m11x-reviewed-listing-source \
            --dir artifacts/m11x/source
          test "$(find artifacts/m11x/source/reviewed-listing-source -path '*/objects/*.json' -type f | wc -l)" -eq 11
          test "$(find artifacts/m11x/source/reviewed-listing-source -path '*/reports/*.json' -type f | wc -l)" -eq 11
      - name: Verify repository provenance
        run: python scripts/verify_provenance.py
      - name: Compile reviewed target listing facts
        run: |
          mkdir -p artifacts/m11x/reviewed-listing
          python scripts/compile_reviewed_listing_facts.py \
            --source-root artifacts/m11x/source/reviewed-listing-source \
            --output artifacts/m11x/reviewed-listing/11x-reviewed-listing-facts.json
          sha256sum artifacts/m11x/reviewed-listing/11x-reviewed-listing-facts.json
      - name: Acquire checksum-verified listing activity
        run: |
          python scripts/audit_reviewed_listing_activity.py \
            --facts artifacts/m11x/reviewed-listing/11x-reviewed-listing-facts.json \
            --root artifacts/m11x/reviewed-listing-activity \
            --output artifacts/m11x/reviewed-listing/11x-reviewed-listing-activity.json
          sha256sum artifacts/m11x/reviewed-listing/11x-reviewed-listing-activity.json
      - uses: actions/upload-artifact@v4
        with:
          name: m11x-reviewed-listing-facts
          path: artifacts/m11x/reviewed-listing
          if-no-files-found: error
