name: M11W Margin Tier Source Probe

on:
  push:
    branches:
      - build/pvb24-v1
    paths:
      - ".github/workflows/m11w-margin-tier-probe.yml"
      - "src/pvb24/data/margin_tier_source.py"
      - "scripts/probe_margin_tier_sources.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e '.[dev]'
      - name: Verify repository provenance
        run: python scripts/verify_provenance.py
      - name: Probe reviewed official margin-tier sources
        run: |
          mkdir -p artifacts/m11w
          python scripts/probe_margin_tier_sources.py \
            --root artifacts/m11w/source-probe \
            --code aa735cd2d8bd4e7bb092179cf086e486 \
            --code 2efd086c96a7435fb89b3392d5eb6df9 \
            --code f9e6ea2d58ce4de5bf9ecadea5170526 \
            | tee artifacts/m11w/source-probe-summary.json
      - uses: actions/upload-artifact@v4
        with:
          name: m11w-margin-tier-source-probe
          path: artifacts/m11w
          if-no-files-found: error
