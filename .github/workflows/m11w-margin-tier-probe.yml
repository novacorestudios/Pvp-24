name: M11W Margin Tier Source Probe

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact build/pvb24-v1 SHA that passed PVB-24 CI
        required: true
        type: string

permissions:
  actions: read
  contents: read

jobs:
  probe:
    if: >-
      github.repository == 'novacorestudios/Pvp-24' &&
      github.ref == 'refs/heads/build/pvb24-v1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e '.[dev]'
      - name: Qualify exact producer SHA against CI
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONPATH: src
        run: |
          python scripts/verify_evidence_ci.py \
            --repository "$GITHUB_REPOSITORY" \
            --sha "${{ inputs.source_sha }}" \
            --wait-seconds 90 \
            --output artifacts/evidence-ci/ci.json
      - name: Verify repository provenance
        run: python scripts/verify_provenance.py
      - name: Probe reviewed official margin-tier sources
        run: |
          mkdir -p artifacts/m11w
          python scripts/probe_margin_tier_sources.py \
            --root artifacts/m11w/source-probe \
            --code aa735cd2d8bd4e7bb092179cf086e486 \
            --code 2efd086c96a7435fb89b3392d5eb6df9 \
            --code f9e6ea2d58ce4de5bf9ecadea5170526 \
            | tee artifacts/m11w/source-probe-summary.json
      - name: Seal evidence artifact qualification
        if: github.event_name != 'pull_request'
        env:
          PYTHONPATH: src
        run: |
          python scripts/qualify_evidence_artifact.py create \
            --root artifacts/m11w \
            --ci-attestation artifacts/evidence-ci/ci.json
          python scripts/qualify_evidence_artifact.py verify \
            --root artifacts/m11w \
            --ci-attestation artifacts/evidence-ci/ci.json \
            --expected-sha "${{ inputs.source_sha }}"
      - uses: actions/upload-artifact@v4
        with:
          name: m11w-margin-tier-source-probe
          path: artifacts/m11w
          if-no-files-found: error
