name: M11X Security Master Obligation Audit

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact build/pvb24-v1 SHA that passed PVB-24 CI
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  audit:
    if: >-
      github.repository == 'novacorestudios/Pvp-24' &&
      github.ref == 'refs/heads/build/pvb24-v1'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      RECOVERY_RUN_ID: "35664842397"
      RECOVERY_SHA256: "6e11a4bcd8b4d1f2e69d855e98a69bd95d2cb857cb53d7b5997b8a5f8bce5918"
      CONFLICT_RUN_ID: "35665991519"
      CONFLICT_RESOLUTION_SHA256: "981f173085c0099e2f085a8e3e74255228361eafdf6f2804e78b58dd136951dc"
      CONFLICT_ACTIVITY_SHA256: "381927b6a9b90b15ba7f80482288e7f8527d50bc24e08cbc9f0a885b228f9f1d"
      REVIEWED_RUN_ID: "35667218255"
      REVIEWED_FACTS_SHA256: "0cd6f41b7ec45838a12dc443f570aeafef4fbbd5c815206fc8dd6f44b873947e"
      REVIEWED_ACTIVITY_SHA256: "0fbee461092fbce785b5358d217de0a64e778fe427dc446866a99630de326bc2"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e '.[dev]'
      - name: Qualify exact producer SHA against CI
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONPATH: src
        run: |
          python scripts/verify_evidence_ci.py \
            --repository "$GITHUB_REPOSITORY" \
            --sha "${{ inputs.source_sha }}" \
            --wait-seconds 90 \
            --output artifacts/evidence-ci/ci.json
      - name: Restore pinned M11X lifecycle recovery
        run: |
          mkdir -p artifacts/m11x/recovery artifacts/m11x/conflict artifacts/m11x/reviewed
          gh run download "$RECOVERY_RUN_ID" \
            --repo "${{ github.repository }}" \
            --name m11x-retained-listing-recovery \
            --dir artifacts/m11x/recovery
          test "$(sha256sum artifacts/m11x/recovery/11x-retained-listing-recovery.json | cut -d' ' -f1)" = "$RECOVERY_SHA256"
          gh run download "$CONFLICT_RUN_ID" \
            --repo "${{ github.repository }}" \
            --name m11x-listing-conflict-resolution \
            --dir artifacts/m11x/conflict
          test "$(sha256sum artifacts/m11x/conflict/11x-listing-conflict-resolution.json | cut -d' ' -f1)" = "$CONFLICT_RESOLUTION_SHA256"
          test "$(sha256sum artifacts/m11x/conflict/11x-listing-conflict-activity.json | cut -d' ' -f1)" = "$CONFLICT_ACTIVITY_SHA256"
          gh run download "$REVIEWED_RUN_ID" \
            --repo "${{ github.repository }}" \
            --name m11x-reviewed-listing-facts \
            --dir artifacts/m11x/reviewed
          test "$(sha256sum artifacts/m11x/reviewed/11x-reviewed-listing-facts.json | cut -d' ' -f1)" = "$REVIEWED_FACTS_SHA256"
          test "$(sha256sum artifacts/m11x/reviewed/11x-reviewed-listing-activity.json | cut -d' ' -f1)" = "$REVIEWED_ACTIVITY_SHA256"
      - name: Verify repository provenance
        run: python scripts/verify_provenance.py
      - name: Compile integrated Security Master obligations
        run: |
          mkdir -p artifacts/m11x/security-master
          python scripts/audit_security_master_obligations.py \
            --input docs/data/11v-historical-metadata-evidence.json \
            --input-sha256 8130ae8d57cb60747daaef379a1713a990937d499a86360c920d0584a7e20252 \
            --recovery artifacts/m11x/recovery/11x-retained-listing-recovery.json \
            --recovery-sha256 "$RECOVERY_SHA256" \
            --conflict-resolution artifacts/m11x/conflict/11x-listing-conflict-resolution.json \
            --conflict-resolution-sha256 "$CONFLICT_RESOLUTION_SHA256" \
            --conflict-activity artifacts/m11x/conflict/11x-listing-conflict-activity.json \
            --conflict-activity-sha256 "$CONFLICT_ACTIVITY_SHA256" \
            --reviewed-facts artifacts/m11x/reviewed/11x-reviewed-listing-facts.json \
            --reviewed-facts-sha256 "$REVIEWED_FACTS_SHA256" \
            --reviewed-activity artifacts/m11x/reviewed/11x-reviewed-listing-activity.json \
            --reviewed-activity-sha256 "$REVIEWED_ACTIVITY_SHA256" \
            --output artifacts/m11x/security-master/11x-security-master-obligations.json
          sha256sum artifacts/m11x/security-master/11x-security-master-obligations.json
      - name: Seal evidence artifact qualification
        env:
          PYTHONPATH: src
        run: |
          python scripts/qualify_evidence_artifact.py create \
            --root artifacts/m11x/security-master \
            --ci-attestation artifacts/evidence-ci/ci.json
          python scripts/qualify_evidence_artifact.py verify \
            --root artifacts/m11x/security-master \
            --ci-attestation artifacts/evidence-ci/ci.json \
            --expected-sha "${{ inputs.source_sha }}"
      - uses: actions/upload-artifact@v4
        with:
          name: m11x-security-master-obligation-audit
          path: artifacts/m11x/security-master
          if-no-files-found: error
