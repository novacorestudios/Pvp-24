name: M11X Security Master Obligation Audit

on:
  push:
    branches:
      - build/pvb24-v1
    paths:
      - ".github/workflows/m11x-security-master-audit.yml"
      - "src/pvb24/data/security_master_audit.py"
      - "scripts/audit_security_master_obligations.py"
      - "docs/data/11v-historical-metadata-evidence.json"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  audit:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      RECOVERY_RUN_ID: "35658684183"
      RECOVERY_SHA256: "6e11a4bcd8b4d1f2e69d855e98a69bd95d2cb857cb53d7b5997b8a5f8bce5918"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e '.[dev]'
      - name: Restore pinned M11X lifecycle recovery
        run: |
          mkdir -p artifacts/m11x/recovery
          gh run download "$RECOVERY_RUN_ID" \
            --repo "${{ github.repository }}" \
            --name m11x-retained-listing-recovery \
            --dir artifacts/m11x/recovery
          test "$(sha256sum artifacts/m11x/recovery/11x-retained-listing-recovery.json | cut -d' ' -f1)" = "$RECOVERY_SHA256"
      - name: Verify repository provenance
        run: python scripts/verify_provenance.py
      - name: Compile integrated Security Master obligations
        run: |
          mkdir -p artifacts/m11x/security-master
          python scripts/audit_security_master_obligations.py \
            --input docs/data/11v-historical-metadata-evidence.json \
            --input-sha256 8130ae8d57cb60747daaef379a1713a990937d499a86360c920d0584a7e20252 \
            --recovery artifacts/m11x/recovery/11x-retained-listing-recovery.json \
            --recovery-sha256 "$RECOVERY_SHA256" \
            --output artifacts/m11x/security-master/11x-security-master-obligations.json
          sha256sum artifacts/m11x/security-master/11x-security-master-obligations.json
      - uses: actions/upload-artifact@v4
        with:
          name: m11x-security-master-obligation-audit
          path: artifacts/m11x/security-master/11x-security-master-obligations.json
          if-no-files-found: error
