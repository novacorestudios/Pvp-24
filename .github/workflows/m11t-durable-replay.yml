name: M11T Durable Evidence Replay

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact build/pvb24-v1 SHA that passed PVB-24 CI
        required: true
        type: string

permissions:
  actions: read
  contents: read

jobs:
  replay:
    if: >-
      github.repository == 'novacorestudios/Pvp-24' &&
      github.ref == 'refs/heads/build/pvb24-v1'
    runs-on: ubuntu-latest
    env:
      SOURCE_QUALIFICATION_SHA256: >-
        ed5539a48c6fca0fca16823bfd4dfd60ad3048c57716635adbb5d04d4b5ddd3a
      BASE_SECURITY_RUN_ID: "35713323687"
      BASE_SECURITY_SHA256: "584045c6a9c909158c61bd70065e5fcb33ba4a2895812a88e313e053a1b66a03"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e '.[dev]'
      - name: Qualify exact producer SHA against CI
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONPATH: src
        run: |
          python scripts/verify_evidence_ci.py \
            --repository "$GITHUB_REPOSITORY" \
            --sha "${{ inputs.source_sha }}" \
            --wait-seconds 90 \
            --output artifacts/evidence-ci/ci.json
      - name: Verify repository provenance
        run: python scripts/verify_provenance.py
      - name: Restore exact durable source set
        run: |
          python scripts/durable_m11t_evidence.py verify             --locator docs/data/11t-durable-evidence.json
          python scripts/durable_m11t_evidence.py restore             --locator docs/data/11t-durable-evidence.json             --destination artifacts/m11t-replay/source             --artifact announcement-inventory-evidence             --artifact announcement-body-qualification-evidence             --artifact lifecycle-archive-reconciliation-evidence
      - name: Replay qualification, recovery, and compilation
        run: |
          python scripts/replay_durable_evidence_chain.py             --locator docs/data/11t-durable-evidence.json             --baseline docs/data/11t-durable-replay-baseline.json             --inventory-root               artifacts/m11t-replay/source/announcement-inventory-evidence             --qualification-root               artifacts/m11t-replay/source/announcement-body-qualification-evidence             --lifecycle-root               artifacts/m11t-replay/source/lifecycle-archive-reconciliation-evidence             --tick-evidence docs/data/11f-announcement-coverage.json             --output artifacts/m11t-replay/output/11t-durable-replay-comparison.json
      - name: Requalify exact retained announcement sources
        run: |
          python scripts/requalify_retained_announcement_evidence.py \
            --locator docs/data/11t-durable-evidence.json \
            --inventory-root \
              artifacts/m11t-replay/source/announcement-inventory-evidence \
            --qualification-root \
              artifacts/m11t-replay/source/announcement-body-qualification-evidence \
            --source-report-sha256 "$SOURCE_QUALIFICATION_SHA256" \
            --output \
              artifacts/m11t-replay/output/11y-retained-announcement-requalification.json
      - name: Reconcile requalified lifecycle facts against official archive
        run: |
          REQUAL="artifacts/m11t-replay/output/11y-retained-announcement-requalification.json"
          REQUAL_SHA="$(sha256sum "$REQUAL" | cut -d' ' -f1)"
          python scripts/reconcile_retained_requalification_activity.py \
            --requalification "$REQUAL" \
            --requalification-sha256 "$REQUAL_SHA" \
            --output-root artifacts/m11t-replay/output/11y-lifecycle-source \
            --output-report \
              artifacts/m11t-replay/output/11y-requalified-lifecycle-activity.json
      - name: Integrate requalified lifecycle with Security Master obligations
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p artifacts/m11t-replay/base-security
          gh run download "$BASE_SECURITY_RUN_ID" \
            --repo "${{ github.repository }}" \
            --name m11x-security-master-obligation-audit \
            --dir artifacts/m11t-replay/base-security
          BASE="artifacts/m11t-replay/base-security/11x-security-master-obligations.json"
          test "$(sha256sum "$BASE" | cut -d' ' -f1)" = "$BASE_SECURITY_SHA256"
          REQUAL="artifacts/m11t-replay/output/11y-retained-announcement-requalification.json"
          LIFE="artifacts/m11t-replay/output/11y-requalified-lifecycle-activity.json"
          python scripts/compile_requalified_security_master_delta.py \
            --base "$BASE" \
            --base-sha256 "$BASE_SECURITY_SHA256" \
            --requalification "$REQUAL" \
            --requalification-sha256 "$(sha256sum "$REQUAL" | cut -d' ' -f1)" \
            --lifecycle "$LIFE" \
            --lifecycle-sha256 "$(sha256sum "$LIFE" | cut -d' ' -f1)" \
            --output \
              artifacts/m11t-replay/output/11y-requalified-security-master-delta.json
      - name: Compile V6 Security Master obligation audit
        run: |
          BASE="artifacts/m11t-replay/base-security/11x-security-master-obligations.json"
          DELTA="artifacts/m11t-replay/output/11y-requalified-security-master-delta.json"
          python scripts/compile_security_master_successor.py \
            --base "$BASE" \
            --base-sha256 "$BASE_SECURITY_SHA256" \
            --delta "$DELTA" \
            --delta-sha256 "$(sha256sum "$DELTA" | cut -d' ' -f1)" \
            --output \
              artifacts/m11t-replay/output/11y-security-master-obligations-v6.json
      - name: Seal evidence artifact qualification
        if: github.event_name != 'pull_request'
        env:
          PYTHONPATH: src
        run: |
          python scripts/qualify_evidence_artifact.py create \
            --root artifacts/m11t-replay/output \
            --ci-attestation artifacts/evidence-ci/ci.json
          python scripts/qualify_evidence_artifact.py verify \
            --root artifacts/m11t-replay/output \
            --ci-attestation artifacts/evidence-ci/ci.json \
            --expected-sha "${{ inputs.source_sha }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m11t-durable-replay-comparison
          path: artifacts/m11t-replay/output
          if-no-files-found: error
