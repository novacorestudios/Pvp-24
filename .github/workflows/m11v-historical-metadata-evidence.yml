name: M11V Historical Metadata Evidence

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact build/pvb24-v1 SHA that passed PVB-24 CI
        required: true
        type: string

permissions:
  actions: read
  contents: read

jobs:
  compile:
    if: >-
      github.repository == 'novacorestudios/Pvp-24' &&
      github.ref == 'refs/heads/build/pvb24-v1'
    runs-on: ubuntu-latest
    env:
      DURABLE_LOCATOR: "docs/data/11t-durable-evidence.json"
      QUALIFICATION_SHA256: "ed5539a48c6fca0fca16823bfd4dfd60ad3048c57716635adbb5d04d4b5ddd3a"
      LIFECYCLE_SHA256: "2c935625dffef3a949b7b30c4dfb55ca75b6b78c70771958d710c6925a0253bd"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e '.[dev]'
      - name: Qualify exact producer SHA against CI
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONPATH: src
        run: |
          python scripts/verify_evidence_ci.py \
            --repository "$GITHUB_REPOSITORY" \
            --sha "${{ inputs.source_sha }}" \
            --wait-seconds 90 \
            --output artifacts/evidence-ci/ci.json
      - name: Restore durable pinned M11T source evidence
        run: |
          python scripts/durable_m11t_evidence.py verify             --locator "$DURABLE_LOCATOR"
          python scripts/durable_m11t_evidence.py restore             --locator "$DURABLE_LOCATOR"             --destination artifacts/m11v/source             --artifact announcement-body-qualification-evidence             --artifact lifecycle-archive-reconciliation-evidence
      - name: Verify exact source report pins
        run: |
          QUAL="artifacts/m11v/source/announcement-body-qualification-evidence/reports/${QUALIFICATION_SHA256}.json"
          LIFE="artifacts/m11v/source/lifecycle-archive-reconciliation-evidence/reports/${LIFECYCLE_SHA256}.json"
          test -f "$QUAL"
          test -f "$LIFE"
          test "$(sha256sum "$QUAL" | cut -d' ' -f1)" = "$QUALIFICATION_SHA256"
          test "$(sha256sum "$LIFE" | cut -d' ' -f1)" = "$LIFECYCLE_SHA256"
      - name: Verify repository provenance
        run: python scripts/verify_provenance.py
      - name: Compile partial historical metadata evidence
        run: |
          QUAL="artifacts/m11v/source/announcement-body-qualification-evidence/reports/${QUALIFICATION_SHA256}.json"
          LIFE="artifacts/m11v/source/lifecycle-archive-reconciliation-evidence/reports/${LIFECYCLE_SHA256}.json"
          TICK="docs/data/11f-announcement-coverage.json"
          TICK_SHA="$(sha256sum "$TICK" | cut -d' ' -f1)"
          mkdir -p artifacts/m11v/output
          python scripts/compile_historical_metadata_evidence.py             --qualification "$QUAL"             --qualification-sha256 "$QUALIFICATION_SHA256"             --lifecycle "$LIFE"             --lifecycle-sha256 "$LIFECYCLE_SHA256"             --tick-evidence "$TICK"             --tick-evidence-sha256 "$TICK_SHA"             --output artifacts/m11v/output/11v-historical-metadata-evidence.json
          sha256sum artifacts/m11v/output/11v-historical-metadata-evidence.json
      - name: Seal evidence artifact qualification
        if: github.event_name != 'pull_request'
        env:
          PYTHONPATH: src
        run: |
          python scripts/qualify_evidence_artifact.py create \
            --root artifacts/m11v/output \
            --ci-attestation artifacts/evidence-ci/ci.json
          python scripts/qualify_evidence_artifact.py verify \
            --root artifacts/m11v/output \
            --ci-attestation artifacts/evidence-ci/ci.json \
            --expected-sha "${{ inputs.source_sha }}"
      - uses: actions/upload-artifact@v4
        with:
          name: m11v-historical-metadata-evidence
          path: artifacts/m11v/output
          if-no-files-found: error
