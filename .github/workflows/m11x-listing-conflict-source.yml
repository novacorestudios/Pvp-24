name: M11X Listing Conflict Source Probe

on:
  push:
    branches:
      - build/pvb24-v1
    paths:
      - ".github/workflows/m11x-listing-conflict-source.yml"
      - "src/pvb24/data/listing_conflict_source.py"
      - "scripts/probe_listing_conflict_sources.py"
      - "src/pvb24/data/evidence_ci.py"
      - "scripts/verify_evidence_ci.py"
      - "scripts/qualify_evidence_artifact.py"
      - "tests/test_evidence_ci.py"
      - "scripts/verify_provenance.py"
      - "src/pvb24/ids.py"
      - "src/pvb24/types.py"
      - "pyproject.toml"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  probe:
    if: >-
      github.repository == 'novacorestudios/Pvp-24' &&
      github.ref == 'refs/heads/build/pvb24-v1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e '.[dev]'
      - name: Qualify exact producer SHA against CI
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONPATH: src
        run: |
          python scripts/verify_evidence_ci.py \
            --repository "$GITHUB_REPOSITORY" \
            --sha "$GITHUB_SHA" \
            --output artifacts/evidence-ci/ci.json
      - name: Verify repository provenance
        run: python scripts/verify_provenance.py
      - name: Retain explicit official conflict sources
        run: |
          mkdir -p artifacts/m11x/listing-conflict-source
          python scripts/probe_listing_conflict_sources.py \
            --root artifacts/m11x/listing-conflict-source \
            --code 02d2b629c7b04786b9a76c132a3ed541 \
            --code e59b61e52ad24b43bd1032052ea3a025 \
            > artifacts/m11x/listing-conflict-source-summary.json
          cat artifacts/m11x/listing-conflict-source-summary.json
          test -s artifacts/m11x/listing-conflict-source-summary.json
          test "$(find artifacts/m11x/listing-conflict-source -path '*/objects/*.json' -type f | wc -l)" -eq 2
          test "$(find artifacts/m11x/listing-conflict-source -path '*/reports/*.json' -type f | wc -l)" -eq 2
      - name: Seal evidence artifact qualification
        if: github.event_name != 'pull_request'
        env:
          PYTHONPATH: src
        run: |
          python scripts/qualify_evidence_artifact.py create \
            --root artifacts/m11x \
            --ci-attestation artifacts/evidence-ci/ci.json
          python scripts/qualify_evidence_artifact.py verify \
            --root artifacts/m11x \
            --ci-attestation artifacts/evidence-ci/ci.json \
            --expected-sha "$GITHUB_SHA"
      - uses: actions/upload-artifact@v4
        with:
          name: m11x-listing-conflict-source
          path: artifacts/m11x
          if-no-files-found: error
