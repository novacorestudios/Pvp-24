name: M11T Durable Source Evidence

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact build/pvb24-v1 SHA that passed PVB-24 CI
        required: true
        type: string

permissions:
  contents: write
  actions: read

concurrency:
  group: m11t-durable-source-evidence
  cancel-in-progress: false

jobs:
  preserve:
    if: >-
      github.repository == 'novacorestudios/Pvp-24' &&
      github.ref == 'refs/heads/build/pvb24-v1'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_MANIFEST: docs/data/11t-source-artifacts.json
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e '.[dev]'
      - name: Qualify exact producer SHA against CI
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONPATH: src
        run: |
          python scripts/verify_evidence_ci.py \
            --repository "$GITHUB_REPOSITORY" \
            --sha "${{ inputs.source_sha }}" \
            --wait-seconds 90 \
            --output artifacts/evidence-ci/ci.json
      - name: Gate durable evidence helper
        run: |
          python -m ruff format --check             src/pvb24/data/durable_evidence.py             scripts/durable_m11t_evidence.py             tests/test_durable_evidence.py
          python -m ruff check             src/pvb24/data/durable_evidence.py             scripts/durable_m11t_evidence.py             tests/test_durable_evidence.py
          python -m pytest -q tests/test_durable_evidence.py
          python scripts/verify_provenance.py
      - name: Verify pinned source run
        shell: bash
        run: |
          set -euo pipefail
          read -r SOURCE_RUN_ID SOURCE_HEAD_SHA < <(
            python - <<'PY'
          import json
          value = json.load(open("docs/data/11t-source-artifacts.json"))
          print(value["source_run_id"], value["source_head_sha"])
          PY
          )
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}" > /tmp/source-run.json
          test "$(python -c 'import json; print(json.load(open("/tmp/source-run.json"))["head_sha"])')"             = "$SOURCE_HEAD_SHA"
          test "$(python -c 'import json; print(json.load(open("/tmp/source-run.json"))["conclusion"])')"             = "success"
      - name: Download exact pinned artifact archives
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/m11t-source-zips
          mapfile -t ARTIFACTS < <(
            python - <<'PY'
          import json
          value = json.load(open("docs/data/11t-source-artifacts.json"))
          for row in value["artifacts"]:
              print(
                  row["artifact_id"],
                  row["archive_file"],
                  row["archive_sha256"],
                  sep="\t",
              )
          PY
          )
          for row in "${ARTIFACTS[@]}"; do
            IFS=$'\t' read -r ARTIFACT_ID ARCHIVE_FILE ARCHIVE_SHA <<< "$row"
            curl --fail --silent --show-error --location               --header "Authorization: Bearer ${GH_TOKEN}"               --header "Accept: application/vnd.github+json"               "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip"               --output "artifacts/m11t-source-zips/${ARCHIVE_FILE}"
            test "$(sha256sum "artifacts/m11t-source-zips/${ARCHIVE_FILE}" | cut -d' ' -f1)"               = "$ARCHIVE_SHA"
          done
      - name: Build and independently restore durable bundle
        shell: bash
        run: |
          set -euo pipefail
          python scripts/durable_m11t_evidence.py build             --source-manifest "$SOURCE_MANIFEST"             --archives-dir artifacts/m11t-source-zips             --output-dir evidence/m11t             --locator docs/data/11t-durable-evidence.json
          python scripts/durable_m11t_evidence.py verify             --locator docs/data/11t-durable-evidence.json
          rm -rf artifacts/m11t-restore-test
          python scripts/durable_m11t_evidence.py restore             --locator docs/data/11t-durable-evidence.json             --destination artifacts/m11t-restore-test
          test -f             artifacts/m11t-restore-test/announcement-body-qualification-evidence/reports/ed5539a48c6fca0fca16823bfd4dfd60ad3048c57716635adbb5d04d4b5ddd3a.json
          test -f             artifacts/m11t-restore-test/lifecycle-archive-reconciliation-evidence/reports/2c935625dffef3a949b7b30c4dfb55ca75b6b78c70771958d710c6925a0253bd.json
      - name: Stage qualified durable evidence artifact
        shell: bash
        run: |
          set -euo pipefail
          rm -rf artifacts/m11t-qualified
          mkdir -p artifacts/m11t-qualified
          cp evidence/m11t/m11t-evidence-*.zip artifacts/m11t-qualified/
          cp evidence/m11t/m11t-evidence-*.manifest.json artifacts/m11t-qualified/
          cp docs/data/11t-durable-evidence.json artifacts/m11t-qualified/
      - name: Seal evidence artifact qualification
        env:
          PYTHONPATH: src
        run: |
          python scripts/qualify_evidence_artifact.py create \
            --root artifacts/m11t-qualified \
            --ci-attestation artifacts/evidence-ci/ci.json
          python scripts/qualify_evidence_artifact.py verify \
            --root artifacts/m11t-qualified \
            --ci-attestation artifacts/evidence-ci/ci.json \
            --expected-sha "${{ inputs.source_sha }}"
      - uses: actions/upload-artifact@v4
        with:
          name: m11t-durable-source-evidence-qualified
          path: artifacts/m11t-qualified
          if-no-files-found: error
      - name: Commit immutable durable evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            evidence/m11t/m11t-evidence-*.zip \
            evidence/m11t/m11t-evidence-*.manifest.json \
            docs/data/11t-durable-evidence.json
          if git diff --cached --quiet; then
            echo "Durable evidence already preserved."
            exit 0
          fi
          git commit -m "data: preserve M11T source evidence durably"
          git push origin HEAD:build/pvb24-v1
