name: PVB-24 Catalog Anchor Review

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact build/pvb24-v1 SHA that passed PVB-24 CI
        required: true
        type: string

permissions:
  actions: read
  contents: read

jobs:
  reviewed-anchor:
    if: >-
      github.repository == 'novacorestudios/Pvp-24' &&
      github.ref == 'refs/heads/build/pvb24-v1'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        catalog: [48, 161]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e '.[dev]'
      - name: Qualify exact producer SHA against CI
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONPATH: src
        run: |
          python scripts/verify_evidence_ci.py \
            --repository "$GITHUB_REPOSITORY" \
            --sha "${{ inputs.source_sha }}" \
            --wait-seconds 90 \
            --output artifacts/evidence-ci/ci.json
      - run: python scripts/verify_provenance.py
      - name: Acquire replay-verified retained pre-Final catalog slice
        run: |
          python scripts/acquire_reviewed_announcement_catalog.py \
            --catalog-id ${{ matrix.catalog }} \
            --window-start 2020-01-01T00:00:00Z \
            --output artifacts/catalog-evidence/${{ matrix.catalog }}
      - name: Seal evidence artifact qualification
        env:
          PYTHONPATH: src
        run: |
          python scripts/qualify_evidence_artifact.py create \
            --root "artifacts/catalog-evidence/${{ matrix.catalog }}" \
            --ci-attestation artifacts/evidence-ci/ci.json
          python scripts/qualify_evidence_artifact.py verify \
            --root "artifacts/catalog-evidence/${{ matrix.catalog }}" \
            --ci-attestation artifacts/evidence-ci/ci.json \
            --expected-sha "${{ inputs.source_sha }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: catalog-evidence-${{ matrix.catalog }}
          path: artifacts/catalog-evidence/${{ matrix.catalog }}
          if-no-files-found: warn
          retention-days: 14

  candidate-inventory:
    if: >-
      github.repository == 'novacorestudios/Pvp-24' &&
      github.ref == 'refs/heads/build/pvb24-v1'
    needs: reviewed-anchor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e '.[dev]'
      - name: Qualify exact producer SHA against CI
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONPATH: src
        run: |
          python scripts/verify_evidence_ci.py \
            --repository "$GITHUB_REPOSITORY" \
            --sha "${{ inputs.source_sha }}" \
            --wait-seconds 90 \
            --output artifacts/evidence-ci/ci.json
      - run: python scripts/verify_provenance.py
      - uses: actions/download-artifact@v4
        with:
          pattern: catalog-evidence-*
          path: artifacts/catalog-input
          merge-multiple: false
      - name: Revalidate pinned slices and build candidate inventory
        shell: bash
        run: |
          set -euo pipefail
          OUT="artifacts/announcement-inventory"
          mkdir -p "$OUT/source"
          cp -a artifacts/catalog-input/catalog-evidence-48/slice "$OUT/source/catalog-48"
          cp -a artifacts/catalog-input/catalog-evidence-161/slice "$OUT/source/catalog-161"

          mapfile -t R48 < <(find "$OUT/source/catalog-48/reports" -maxdepth 1 -type f -name '*.json' | sort)
          mapfile -t R161 < <(find "$OUT/source/catalog-161/reports" -maxdepth 1 -type f -name '*.json' | sort)
          test "${#R48[@]}" -eq 1
          test "${#R161[@]}" -eq 1
          H48="$(basename "${R48[0]}" .json)"
          H161="$(basename "${R161[0]}" .json)"

          python scripts/build_announcement_inventory.py \
            --slice "$OUT/source/catalog-48" "reports/$H48.json" "$H48" \
            --slice "$OUT/source/catalog-161" "reports/$H161.json" "$H161" \
            --output "$OUT"
      - name: Seal evidence artifact qualification
        env:
          PYTHONPATH: src
        run: |
          python scripts/qualify_evidence_artifact.py create \
            --root artifacts/announcement-inventory \
            --ci-attestation artifacts/evidence-ci/ci.json
          python scripts/qualify_evidence_artifact.py verify \
            --root artifacts/announcement-inventory \
            --ci-attestation artifacts/evidence-ci/ci.json \
            --expected-sha "${{ inputs.source_sha }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: announcement-inventory-evidence
          path: artifacts/announcement-inventory
          if-no-files-found: error
          retention-days: 14

  body-qualification:
    if: >-
      github.repository == 'novacorestudios/Pvp-24' &&
      github.ref == 'refs/heads/build/pvb24-v1'
    needs: candidate-inventory
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e '.[dev]'
      - name: Qualify exact producer SHA against CI
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONPATH: src
        run: |
          python scripts/verify_evidence_ci.py \
            --repository "$GITHUB_REPOSITORY" \
            --sha "${{ inputs.source_sha }}" \
            --wait-seconds 90 \
            --output artifacts/evidence-ci/ci.json
      - run: python scripts/verify_provenance.py
      - uses: actions/download-artifact@v4
        with:
          name: announcement-inventory-evidence
          path: artifacts/announcement-inventory
      - name: Restore retained candidate body sources
        run: |
          python scripts/durable_m11t_evidence.py verify \
            --locator docs/data/11t-durable-evidence.json
          python scripts/durable_m11t_evidence.py restore \
            --locator docs/data/11t-durable-evidence.json \
            --destination artifacts/catalog-retained \
            --artifact announcement-body-qualification-evidence
      - name: Replay and semantically qualify retained candidate bodies
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t REPORTS < <(find artifacts/announcement-inventory/reports -maxdepth 1 -type f -name '*.json' | sort)
          test "${#REPORTS[@]}" -eq 1
          HINV="$(basename "${REPORTS[0]}" .json)"
          python scripts/qualify_announcement_inventory.py \
            --inventory-root artifacts/announcement-inventory \
            --inventory-report "reports/$HINV.json" \
            --inventory-sha256 "$HINV" \
            --retained-source-root \
              artifacts/catalog-retained/announcement-body-qualification-evidence \
            --retained-report-sha256 \
              ed5539a48c6fca0fca16823bfd4dfd60ad3048c57716635adbb5d04d4b5ddd3a \
            --output artifacts/announcement-body-qualification
      - name: Seal evidence artifact qualification
        env:
          PYTHONPATH: src
        run: |
          python scripts/qualify_evidence_artifact.py create \
            --root artifacts/announcement-body-qualification \
            --ci-attestation artifacts/evidence-ci/ci.json
          python scripts/qualify_evidence_artifact.py verify \
            --root artifacts/announcement-body-qualification \
            --ci-attestation artifacts/evidence-ci/ci.json \
            --expected-sha "${{ inputs.source_sha }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: announcement-body-qualification-evidence
          path: artifacts/announcement-body-qualification
          if-no-files-found: warn
          retention-days: 14

  lifecycle-archive-reconciliation:
    if: >-
      github.repository == 'novacorestudios/Pvp-24' &&
      github.ref == 'refs/heads/build/pvb24-v1'
    needs: body-qualification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e '.[dev]'
      - name: Qualify exact producer SHA against CI
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONPATH: src
        run: |
          python scripts/verify_evidence_ci.py \
            --repository "$GITHUB_REPOSITORY" \
            --sha "${{ inputs.source_sha }}" \
            --wait-seconds 90 \
            --output artifacts/evidence-ci/ci.json
      - run: python scripts/verify_provenance.py
      - uses: actions/download-artifact@v4
        with:
          name: announcement-inventory-evidence
          path: artifacts/announcement-inventory
      - uses: actions/download-artifact@v4
        with:
          name: announcement-body-qualification-evidence
          path: artifacts/announcement-body-qualification
      - name: Reconcile lifecycle pins with official daily LAST activity
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t REPORTS < <(find artifacts/announcement-body-qualification/reports -maxdepth 1 -type f -name '*.json' | sort)
          test "${#REPORTS[@]}" -eq 1
          HQ="$(basename "${REPORTS[0]}" .json)"
          python scripts/reconcile_lifecycle_activity.py \
            --inventory-root artifacts/announcement-inventory \
            --qualification-root artifacts/announcement-body-qualification \
            --qualification-report "reports/$HQ.json" \
            --qualification-sha256 "$HQ" \
            --output artifacts/lifecycle-archive-reconciliation
      - name: Seal evidence artifact qualification
        env:
          PYTHONPATH: src
        run: |
          python scripts/qualify_evidence_artifact.py create \
            --root artifacts/lifecycle-archive-reconciliation \
            --ci-attestation artifacts/evidence-ci/ci.json
          python scripts/qualify_evidence_artifact.py verify \
            --root artifacts/lifecycle-archive-reconciliation \
            --ci-attestation artifacts/evidence-ci/ci.json \
            --expected-sha "${{ inputs.source_sha }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lifecycle-archive-reconciliation-evidence
          path: artifacts/lifecycle-archive-reconciliation
          if-no-files-found: warn
          retention-days: 14
