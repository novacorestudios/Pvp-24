name: PVB-24 Catalog Anchor Review

on:
  push:
    branches: [build/pvb24-v1]
    paths:
      - ".github/workflows/catalog-anchor-review.yml"
      - "src/pvb24/data/announcement_anchor.py"
      - "scripts/review_announcement_catalog_anchor.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reviewed-anchor:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        catalog: [48, 161]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e '.[dev]'
      - run: python scripts/verify_provenance.py
      - name: Review pre-Final catalog anchor
        run: |
          python scripts/review_announcement_catalog_anchor.py \
            --catalog-id ${{ matrix.catalog }} \
            --output artifacts/catalog-anchor-review/${{ matrix.catalog }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: catalog-anchor-review-${{ matrix.catalog }}
          path: artifacts/catalog-anchor-review/${{ matrix.catalog }}
          if-no-files-found: warn
          retention-days: 14
