name: PVB-24 CI
on: [push, pull_request, workflow_dispatch]
permissions:
  actions: write
  contents: read
jobs:
  governance:
    runs-on: ubuntu-latest
    env:
      FREQTRADE_TAG: "2026.8"
      FREQTRADE_SHA: "9f10e357a93c1dcf10c2a2b367659214d89c073e"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e '.[dev]'
      - run: python -m ruff format --check .
      - run: python -m ruff check .
      - run: python -m pytest -q
      - run: python scripts/verify_provenance.py
      - run: python scripts/check_operational_package.py
      - run: python scripts/smoke_reference.py --output artifacts/reference-smoke-ci
  freqtrade-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pvb24-pip-${{ runner.os }}-py312-${{ hashFiles('config/freqtrade-python312.lock') }}
      - run: python scripts/bootstrap_freqtrade.py --install
      - run: .deps/freqtrade/.venv/bin/python scripts/smoke_freqtrade.py
      - run: .deps/freqtrade/.venv/bin/python scripts/smoke_freqtrade_parity.py
      - run: .deps/freqtrade/.venv/bin/python scripts/smoke_freqtrade_parity.py --framework

  dispatch-evidence:
    needs: [governance, freqtrade-smoke]
    if: >-
      github.event_name == 'push' &&
      github.repository == 'novacorestudios/Pvp-24' &&
      github.ref == 'refs/heads/build/pvb24-v1' &&
      needs.governance.result == 'success' &&
      needs.freqtrade-smoke.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Dispatch only affected evidence workflows
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python scripts/dispatch_evidence_workflows.py \
            --repository "$GITHUB_REPOSITORY" \
            --ref build/pvb24-v1 \
            --source-sha "$GITHUB_SHA" \
            --base "${{ github.event.before }}" \
            --head "$GITHUB_SHA"
