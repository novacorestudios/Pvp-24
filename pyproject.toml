[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pvb24"
version = "1.0.0"
requires-python = ">=3.12"
description = "PVB-24 causal research engine; live trading disabled"

[project.optional-dependencies]
dev = ["pytest==8.4.2", "ruff==0.16.3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
